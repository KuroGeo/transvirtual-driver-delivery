<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc"><title id="title">Offline results, with a clear confirmation boundary.</title><desc id="desc">Save: Result + outbox. Restore: Same database, new process. Confirm: Matching ACK committed. The queue survives until confirmation is durable.</desc><rect width="1200" height="320" rx="20" fill="#fff9f0"/><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" fill="#2e2b27"><path d="M238 106H572M628 106H962" stroke="#dddcd2" stroke-width="3"/><path d="m550 97 11 9-11 9m390-18 11 9-11 9" fill="none" stroke="#b76838" stroke-width="3"/><g id="save"><circle cx="210" cy="106" r="28" fill="#f16c30"/><text x="210" y="115" text-anchor="middle" fill="#fffefa" font-size="24" font-weight="700">1</text><text x="210" y="185" text-anchor="middle" font-size="48" font-weight="700">Save</text><text x="210" y="228" text-anchor="middle" fill="#6e746b" font-size="24">Result + outbox</text></g><g id="restore"><circle cx="600" cy="106" r="28" fill="#f16c30"/><text x="600" y="115" text-anchor="middle" fill="#fffefa" font-size="24" font-weight="700">2</text><text x="600" y="185" text-anchor="middle" font-size="48" font-weight="700">Restore</text><text x="600" y="228" text-anchor="middle" fill="#6e746b" font-size="24">Same database, new process</text></g><g id="confirm"><circle cx="990" cy="106" r="28" fill="#567454"/><text x="990" y="115" text-anchor="middle" fill="#fffefa" font-size="24" font-weight="700">3</text><text x="990" y="185" text-anchor="middle" font-size="48" font-weight="700">Confirm</text><text x="990" y="228" text-anchor="middle" fill="#6e746b" font-size="24">Matching ACK committed</text></g><text x="600" y="287" text-anchor="middle" font-size="22" fill="#6e746b">The queue survives until confirmation is durable.</text></g></svg>
