<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc"><title id="title">离线结果，有明确的确认边界。</title><desc id="desc">保存: 结果 + Outbox. 恢复: 同一数据库，新进程. 确认: 匹配 ACK 已持久化. 确认可靠落盘之前，队列继续保留。</desc><rect width="1200" height="320" rx="20" fill="#fff9f0"/><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" fill="#2e2b27"><path d="M238 106H572M628 106H962" stroke="#dddcd2" stroke-width="3"/><path d="m550 97 11 9-11 9m390-18 11 9-11 9" fill="none" stroke="#b76838" stroke-width="3"/><g id="save"><circle cx="210" cy="106" r="28" fill="#f16c30"/><text x="210" y="115" text-anchor="middle" fill="#fffefa" font-size="24" font-weight="700">1</text><text x="210" y="185" text-anchor="middle" font-size="48" font-weight="700">保存</text><text x="210" y="228" text-anchor="middle" fill="#6e746b" font-size="24">结果 + Outbox</text></g><g id="restore"><circle cx="600" cy="106" r="28" fill="#f16c30"/><text x="600" y="115" text-anchor="middle" fill="#fffefa" font-size="24" font-weight="700">2</text><text x="600" y="185" text-anchor="middle" font-size="48" font-weight="700">恢复</text><text x="600" y="228" text-anchor="middle" fill="#6e746b" font-size="24">同一数据库，新进程</text></g><g id="confirm"><circle cx="990" cy="106" r="28" fill="#567454"/><text x="990" y="115" text-anchor="middle" fill="#fffefa" font-size="24" font-weight="700">3</text><text x="990" y="185" text-anchor="middle" font-size="48" font-weight="700">确认</text><text x="990" y="228" text-anchor="middle" fill="#6e746b" font-size="24">匹配 ACK 已持久化</text></g><text x="600" y="287" text-anchor="middle" font-size="22" fill="#6e746b">确认可靠落盘之前，队列继续保留。</text></g></svg>
